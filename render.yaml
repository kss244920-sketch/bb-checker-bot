services:
  - type: web
    name: bb-checker-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -u bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BOT_TOKEN
        value: 8905621538:AAFRw0UJLm-JPear_6rXhR204UiNCyMq2ow
      - key: DEFAULT_LOG_CHANNEL
        value: "-1003946923981"
      - key: DEFAULT_STORAGE_CHANNEL
        value: "-1003907841421"
      - key: ADMIN_USER_IDS
        value: "8219398815,8327850869"
